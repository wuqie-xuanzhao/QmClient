[[message]]
key = "Toggles use of standard eye-emotes on/off, eyeemote s, where s = on for on, off for off, toggle for toggle and nothing to show current status"
[message.translations]
simplified_chinese = "打开/关闭标准眼睛表情的使用，eyeemote s，其中 s = on 表示打开，off 表示关闭，toggle 表示切换，不显示当前状态"
traditional_chinese = "開啟/關閉標準眼睛表情的使用，eyeemote s，其中 s = on 表示開啟，off 表示關閉，toggle 表示切換，空白則顯示目前狀態"
japanese = "標準の目のエモートの使用をオン/オフに切り替え。eyeemote s（s = on: オン、off: オフ、toggle: 切り替え、空: 現在の状態表示）"
korean = "표준 눈 이모트 사용 켜기/끄기 전환, eyeemote s, 여기서 s = on은 켜기, off는 끄기, toggle은 전환, 아무것도 없으면 현재 상태 표시"
russian = "Включить/выключить использование стандартных эмоций глаз, eyeemote s, где s = on для вкл, off для выкл, toggle для переключения и ничего для отображения текущего статуса"
german = "Verwendung von Standard-Augen-Emotes ein-/ausschalten, eyeemote s, wobei s = on für an, off für aus, toggle für umschalten und nichts, um den aktuellen Status anzuzeigen"
spanish = "Alternar el uso de emotes oculares estándar, eyeemote s, donde s = on para activado, off para desactivado, toggle para alternar y nada para mostrar el estado actual"
french = "Active/désactive l'utilisation des émoticônes oculaires standard, eyeemote s, où s = on pour activé, off pour désactivé, toggle pour basculer et rien pour afficher le statut actuel"
brazilian_portuguese = "Alterna o uso de emotes oculares padrão ligado/desligado, eyeemote s, onde s = on para ligado, off para desligado, toggle para alternar e nada para mostrar status atual"
portuguese = "Alternar uso de emotes oculares padrão ligado/desligado, eyeemote s, onde s = on para ligado, off para desligado, toggle para alternar e nada para mostrar estado atual"
turkish = "Standart göz ifadelerinin kullanımını aç/kapa, eyeemote s, burada s = açık için on, kapalı için off, değiştir için toggle ve geçerli durumu göstermek için hiçbir şey"
polish = "Przełącz używanie standardowych emotek oczu włączone/wyłączone, eyeemote s, gdzie s = on dla włączone, off dla wyłączone, toggle dla przełączenia i nic, aby pokazać bieżący status"

traditional_chinese = "指令記錄期間偵測到錯誤。請嘗試更新顯卡驅動程式。"

[[message]]
key = "Could not initialize the given graphics backend, reverting to the default backend now."
context = "Graphics error"
[message.translations]
japanese = "指定されたグラフィックスバックエンドを初期化できませんでした。デフォルトのバックエンドに戻します。"
korean = "지정된 그래픽 백엔드를 초기화할 수 없어 기본 백엔드로 되돌립니다."
simplified_chinese = "无法初始化当前配置的图形后端，正在将配置回退至默认图形后端。"
traditional_chinese = "無法初始化當前配置的圖形後端，正在將配置回退至預設圖形後端。"

[[message]]
key = "Could not initialize the given graphics backend, this is probably because you didn't install the driver of the integrated graphics card."
context = "Graphics error"
[message.translations]
japanese = "指定されたグラフィックスバックエンドを初期化できませんでした。おそらく、内蔵グラフィックスのドライバーがインストールされていないためです。"
korean = "지정된 그래픽 백엔드를 초기화할 수 없습니다. 내장 그래픽 드라이버가 설치되지 않았을 수 있습니다."
simplified_chinese = "无法初始化当前配置的图形后端，请检查此电脑是否已安装集成显卡的驱动程序。"
traditional_chinese = "無法初始化當前配置的圖形後端，請檢查此電腦是否已安裝內建顯示卡的驅動程式。"

[[message]]
key = "Failed during initialization. Try to change gfx_backend to OpenGL or Vulkan in settings_ddnet.cfg in the config directory and try again."
context = "Graphics error"
[message.translations]
japanese = "初期化に失敗しました。設定ディレクトリの settings_ddnet.cfg で gfx_backend を OpenGL または Vulkan に変更して、再試行してください。"
korean = "초기화 중 실패했습니다. 설정 디렉토리의 settings_ddnet.cfg에서 gfx_backend를 OpenGL 또는 Vulkan으로 변경한 후 다시 시도하세요."
simplified_chinese = "初始化失败。请尝试打开配置目录中的设置文件（settings_ddnet.cfg）并将 “gfx_backend” 设置为 “gfx_backend OpenGL” 或 “gfx_backend Vulkan” 再重试。"
traditional_chinese = "初始化失敗。請嘗試打開配置目錄中的設定檔（settings_ddnet.cfg）並將「gfx_backend」設定為「gfx_backend OpenGL」或「gfx_backend Vulkan」再重試。"

[[message]]
key = "Failed to swap framebuffers. Try to update your GPU drivers."
context = "Graphics error"
[message.translations]
japanese = "フレームバッファのスワップに失敗しました。GPUドライバーを更新してみてください。"
korean = "프레임버퍼 교체 실패. GPU 드라이버를 업데이트해 보세요."
simplified_chinese = "帧缓存交替失败。请尝试更新显卡驱动程序。"
traditional_chinese = "幀緩衝區交換失敗。請嘗試更新顯卡驅動程式。"

[[message]]
key = "Out of VRAM. Try setting 'cl_skins_loaded_max' to a lower value or remove custom assets (skins, entities, etc.), especially those with high resolution."
context = "Graphics error"
[message.translations]
japanese = "VRAM が不足しています。'cl_skins_loaded_max' を低い値に設定するか、カスタムアセット（スキン、エンティティなど）、特に高解像度のものを削除してみてください。"
korean = "VRAM 부족. 'cl_skins_loaded_max' 값을 낮추거나 사용자 정의 에셋(스킨, 엔티티 등), 특히 고해상도 에셋을 제거해 보세요."
simplified_chinese = "显存不足。请尝试将 'cl_skins_loaded_max' 设置为较低的值或移除自定义资源（皮肤、实体等），尤其是高分辨率的资源。"
traditional_chinese = "視訊記憶體不足。請嘗試將 'cl_skins_loaded_max' 設定為較低的值或移除自訂資源（皮膚、實體等），尤其是高解析度的資源。"

[[message]]
key = "Submitting the render commands failed. Try to update your GPU drivers."
context = "Graphics error"
[message.translations]
japanese = "レンダリングコマンドの送信に失敗しました。GPUドライバーを更新してみてください。"
korean = "렌더 명령 제출에 실패했습니다. GPU 드라이버를 업데이트해 보세요."
simplified_chinese = "渲染指令提交失败。请尝试更新显卡驱动程序。"
traditional_chinese = "渲染指令提交失敗。請嘗試更新顯卡驅動程式。"

[[message]]
key = "Unknown error. Try to change gfx_backend to OpenGL or Vulkan in settings_ddnet.cfg in the config directory and try again."
context = "Graphics error"
[message.translations]
japanese = "不明なエラー。設定ディレクトリの settings_ddnet.cfg で gfx_backend を OpenGL または Vulkan に変更して、再試行してください。"
korean = "알 수 없는 오류입니다. 설정 디렉터리의 settings_ddnet.cfg에서 gfx_backend를 OpenGL 또는 Vulkan으로 변경하고 다시 시도하세요."
simplified_chinese = "未知错误。请尝试打开配置目录中的设置文件（settings_ddnet.cfg）并将 “gfx_backend” 设置为 “gfx_backend OpenGL” 或 “gfx_backend Vulkan” 再重试。"
traditional_chinese = "未知錯誤。請嘗試打開配置目錄中的設定檔（settings_ddnet.cfg）並將「gfx_backend」設定為「gfx_backend OpenGL」或「gfx_backend Vulkan」再重試。"


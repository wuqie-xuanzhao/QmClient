[[message]]
key = "/times ?s?i shows last 5 times of the server or of a player beginning with name s starting with time i (i = 1 by default, -1 for first)"
[message.translations]
simplified_chinese = "/times ?s?i 显示服务器最近 5 次成绩，或名称以 s 开头玩家从第 i 条开始的成绩（i 默认 1，-1 表示第一条）"
traditional_chinese = "Pending traditional_chinese translation 0031784c02"
japanese = "Pending japanese translation b0c7a11bcd"
korean = "/times ?s?i 는 서버의 최근 5회 기록 또는 이름이 s 로 시작하는 플레이어의 i 번째부터의 기록을 표시합니다 (i 기본값 1, -1은 첫 번째)"
russian = "/times ?s?i показывает последние 5 результатов сервера или игрока, имя которого начинается с s, начиная с результата i (i = 1 по умолчанию, -1 для первого)"
german = "/times ?s?i zeigt die letzten 5 Zeiten des Servers oder eines Spielers, dessen Name mit s beginnt, beginnend mit Zeit i (i = 1 standardmäßig, -1 für die erste)"
spanish = "/times ?s?i muestra los últimos 5 tiempos del servidor o de un jugador cuyo nombre comienza con s empezando desde el tiempo i (i = 1 por defecto, -1 para el primero)"
french = "/times ?s?i affiche les 5 derniers temps du serveur ou d'un joueur commençant par le nom s à partir du temps i (i = 1 par défaut, -1 pour le premier)"
brazilian_portuguese = "/times ?s?i mostra os últimos 5 tempos do servidor ou de um jogador começando com nome s a partir do tempo i (i = 1 por padrão, -1 para o primeiro)"
portuguese = "/times ?s?i mostra os últimos 5 tempos do servidor ou de um jogador cujo nome começa com s começando pelo tempo i (i = 1 por defeito, -1 para o primeiro)"
turkish = "/times ?s?i sunucunun son 5 süresini veya adı s ile başlayan bir oyuncunun i. süreden itibaren sonuçlarını gösterir (i varsayılan 1, -1 ilk sonuç)"
polish = "/times ?s?i pokazuje ostatnie 5 czasów serwera lub gracza zaczynającego się od nazwy s, zaczynając od czasu i (i = 1 domyślnie, -1 dla pierwszego)"


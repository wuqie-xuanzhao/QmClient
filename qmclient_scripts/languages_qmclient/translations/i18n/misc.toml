[[message]]
key = "Personal Setting of showing time in either broadcast or game/round timer, timer s, where s = broadcast for broadcast, gametimer for game/round timer, cycle for cycle, both for both, none for no timer and nothing to show current status"
[message.translations]
simplified_chinese = "在广播或游戏/回合计时器中显示时间的个人设置，计时器 s，其中 s = 广播的广播，游戏/回合计时器的游戏计时器，循环的循环，两者都适用，无计时器且不显示当前状态"
traditional_chinese = "在廣播或遊戲/回合計時器中顯示時間的個人設定，計時器 s，其中 s = broadcast 為廣播，gametimer 為遊戲/回合計時器，cycle 為循環，both 為兩者，none 為無計時器，空白為顯示目前狀態"
japanese = "時間表示の個人設定（ブロードキャストまたはゲーム/ラウンドタイマー）、timer s（s = broadcast: ブロードキャスト、gametimer: ゲーム/ラウンドタイマー、cycle: サイクル、both: 両方、none: タイマーなし、空: 現在のステータス表示）"
korean = "방송 또는 게임/라운드 타이머에 시간을 표시하는 개인 설정, 타이머 s, 여기서 s = broadcast는 방송, gametimer는 게임/라운드 타이머, cycle은 주기, both는 둘 다, none은 타이머 없음, 아무것도 입력하지 않으면 현재 상태 표시"
russian = "Личная настройка отображения времени в широковещательном или игровом/раундовом таймере, timer s, где s = broadcast для широковещательного, gametimer для игрового/раундового таймера, cycle для цикла, both для обоих, none без таймера и ничего для отображения текущего статуса"
german = "Persönliche Einstellung zur Anzeige der Zeit entweder im Broadcast oder im Spiel-/Runden-Timer, Timer s, wobei s = broadcast für Broadcast, gametimer für Spiel-/Runden-Timer, cycle für Zyklus, both für beides, none für keinen Timer und nichts, um den aktuellen Status anzuzeigen"
spanish = "Configuración personal para mostrar el tiempo en la transmisión o el temporizador de juego/ronda, temporizador s, donde s = broadcast para transmisión, gametimer para temporizador de juego/ronda, cycle para ciclo, both para ambos, none para sin temporizador y nada para mostrar el estado actual"
french = "Paramètre personnel pour afficher le temps soit dans la diffusion soit dans le chronomètre de jeu/tour, timer s, où s = broadcast pour la diffusion, gametimer pour le chronomètre de jeu/tour, cycle pour le cycle, both pour les deux, none pour aucun chronomètre et rien pour afficher le statut actuel"
brazilian_portuguese = "Configuração pessoal de exibição de tempo em transmissão ou temporizador de jogo/rodada, temporizador s, onde s = broadcast para transmissão, gametimer para temporizador de jogo/rodada, cycle para ciclo, both para ambos, none para nenhum temporizador e nada para mostrar status atual"
portuguese = "Definição pessoal de mostrar tempo na transmissão ou temporizador de jogo/ronda, temporizador s, onde s = broadcast para transmissão, gametimer para temporizador de jogo/ronda, cycle para ciclo, both para ambos, none para nenhum temporizador e nada para mostrar estado atual"
turkish = "Süreyi duyuruda veya oyun/tur zamanlayıcısında gösterme kişisel ayarı, zamanlayıcı s, burada s = duyuru için broadcast, oyun/tur zamanlayıcısı için gametimer, döngü için cycle, her ikisi için both, zamanlayıcı yok için none ve geçerli durumu göstermek için hiçbir şey"
polish = "Osobiste ustawienie wyświetlania czasu w transmisji lub timerze gry/rundy, timer s, gdzie s = broadcast dla transmisji, gametimer dla timera gry/rundy, cycle dla cyklu, both dla obu, none dla braku timera i nic, aby pokazać bieżący status"

[[message]]
key = "Teleport yourself out of freeze if auto rescue mode is enabled, otherwise it will set position for rescuing if grounded and teleport you out of freeze if not (use sv_rescue 1 to enable this feature)"
[message.translations]
simplified_chinese = "若启用自动救援模式，则直接将你传送出冻结；否则，落地时会记录救援位置，未落地则直接传送出冻结（用 sv_rescue 1 启用）"
traditional_chinese = "Pending traditional_chinese translation 489cd85dfd"
japanese = "Pending japanese translation f5aead61ef"
korean = "자동 구조 모드가 활성화된 경우 동결 상태에서 순간이동합니다. 그렇지 않은 경우, 땅에 닿았을 때 구조 위치를 설정하고 닿지 않았을 때 동결에서 순간이동합니다 (sv_rescue 1 로 이 기능을 활성화하세요)"
russian = "Телепортироваться из заморозки, если включён режим автоспасения; в противном случае установит позицию для спасения, если на земле, и телепортирует из заморозки, если нет (используйте sv_rescue 1 для включения этой функции)"
german = "Teleportiere dich aus dem Freeze, wenn der automatische Rettungsmodus aktiviert ist, sonst wird die Position für die Rettung gesetzt, wenn du am Boden bist, und dich aus dem Freeze teleportiert, wenn nicht (verwende sv_rescue 1, um diese Funktion zu aktivieren)"
spanish = "Teletransportarte fuera de la congelación si el modo de rescate automático está habilitado, de lo contrario establecerá la posición para rescatar si estás en el suelo y te teletransportará fuera de la congelación si no (usa sv_rescue 1 para habilitar esta función)"
french = "Téléportez-vous hors du gel si le mode de sauvetage automatique est activé, sinon cela définira une position de sauvetage si vous êtes au sol et vous téléportera hors du gel sinon (utilisez sv_rescue 1 pour activer cette fonctionnalité)"
brazilian_portuguese = "Teleporte-se para fora do congelamento se o modo de resgate automático estiver ativado, caso contrário, definirá a posição para resgate se estiver no chão e o teleportará para fora do congelamento se não estiver (use sv_rescue 1 para ativar este recurso)"
portuguese = "Teletransporta-te para fora do congelamento se o modo de resgate automático estiver ativado, caso contrário definirá a posição para resgate se estiver no chão e teletransporta-te para fora do congelamento se não estiver (usa sv_rescue 1 para ativar esta função)"
turkish = "Otomatik kurtarma modu etkinse kendini donmadan ışınla, aksi takdirde yerdeysen kurtarma için konum belirler ve değilsen seni donmadan ışınlar (bu özelliği etkinleştirmek için sv_rescue 1 kullanın)"
polish = "Teleportuj się z zamrożenia, jeśli włączony jest tryb automatycznego ratunku, w przeciwnym razie ustawi pozycję do ratunku, jeśli jesteś na ziemi, i teleportuje cię z zamrożenia, jeśli nie (użyj sv_rescue 1, aby włączyć tę funkcję)"


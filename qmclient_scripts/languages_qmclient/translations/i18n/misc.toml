polish = "Nie można zainicjować podanego backendu graficznego, prawdopodobnie dlatego, że nie zainstalowałeś sterownika zintegrowanej karty graficznej."

[[message]]
key = "Failed during initialization. Try to change gfx_backend to OpenGL or Vulkan in qmclient/settings_ddnet.cfg in the config directory and try again."
context = "Graphics error"
[message.translations]
japanese = "初期化に失敗しました。設定ディレクトリの qmclient/settings_ddnet.cfg で gfx_backend を OpenGL または Vulkan に変更して、再試行してください。"
korean = "초기화 중 실패했습니다. 설정 디렉토리의 qmclient/settings_ddnet.cfg에서 gfx_backend를 OpenGL 또는 Vulkan으로 변경한 후 다시 시도하세요."
simplified_chinese = "初始化失败。请尝试打开配置目录中的设置文件（qmclient/settings_ddnet.cfg）并将 “gfx_backend” 设置为 “gfx_backend OpenGL” 或 “gfx_backend Vulkan” 再重试。"
traditional_chinese = "初始化失敗。請嘗試打開配置目錄中的設定檔（qmclient/settings_ddnet.cfg）並將「gfx_backend」設定為「gfx_backend OpenGL」或「gfx_backend Vulkan」再重試。"
russian = "Ошибка инициализации. Попробуйте изменить gfx_backend на OpenGL или Vulkan в файле qmclient/settings_ddnet.cfg в папке конфигурации и повторите попытку."
german = "Fehler bei der Initialisierung. Versuche, gfx_backend in qmclient/settings_ddnet.cfg im Konfigurationsverzeichnis auf OpenGL oder Vulkan zu ändern und versuche es erneut."
spanish = "Falló durante la inicialización. Intenta cambiar gfx_backend a OpenGL o Vulkan en qmclient/settings_ddnet.cfg en el directorio de configuración e inténtalo de nuevo."
french = "Échec lors de l'initialisation. Essayez de changer gfx_backend en OpenGL ou Vulkan dans qmclient/settings_ddnet.cfg dans le répertoire de configuration et réessayez."
brazilian_portuguese = "Falha durante a inicialização. Tente alterar gfx_backend para OpenGL ou Vulkan em qmclient/settings_ddnet.cfg no diretório de configuração e tente novamente."
portuguese = "Falha durante a inicialização. Tenta mudar gfx_backend para OpenGL ou Vulkan no ficheiro qmclient/settings_ddnet.cfg no diretório de configuração e tenta novamente."
turkish = "Başlatma sırasında başarısız oldu. Yapılandırma dizinindeki qmclient/settings_ddnet.cfg dosyasında gfx_backend'i OpenGL veya Vulkan olarak değiştirmeyi ve tekrar denemeyi deneyin."
polish = "Niepowodzenie podczas inicjalizacji. Spróbuj zmienić gfx_backend na OpenGL lub Vulkan w qmclient/settings_ddnet.cfg w katalogu konfiguracyjnym i spróbuj ponownie."


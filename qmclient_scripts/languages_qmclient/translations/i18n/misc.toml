japanese = "チームセーブ進行中。成功時は「/load %s」、失敗時は「/load %s」でロードできます。"
korean = "팀 저장 진행 중입니다. 저장 성공 시 '/load %s'로, 실패 시 '/load %s'로 불러올 수 있습니다."

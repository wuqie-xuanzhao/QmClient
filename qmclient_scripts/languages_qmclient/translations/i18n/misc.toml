[[message]]
key = "Team successfully saved by %s. The database connection failed, using generated save code instead to avoid collisions. Use '/load %s' on %s to continue"
[message.translations]
japanese = "%s によるチームセーブ成功。データベース接続に失敗したため、衝突を避けるために生成されたセーブコードを使用します。%s で「/load %s」を使用して続行"
korean = "%s 님이 팀을 성공적으로 저장했습니다. 데이터베이스 연결에 실패하여 충돌을 피하기 위해 생성된 저장 코드를 사용합니다. %s에서 '/load %s'를 사용하여 계속하세요."
simplified_chinese = "队伍已由 %s 成功存档。数据库连接失败，因此改用生成的存档码避免冲突。请在 %s 上用 '/load %s' 继续"
traditional_chinese = "隊伍已由 %s 成功存檔。資料庫連線失敗，因此改用產生的存檔碼避免衝突。請在 %s 上用 '/load %s' 繼續"


[[message]]
key = "/times ?s?i shows last 5 times of the server or of a player beginning with name s starting with time i (i = 1 by default, -1 for first)"
[message.translations]
japanese = "/times ?s?i は、サーバーの直近 5 回のタイム、または名前が s で始まるプレイヤーのタイムを i 番目から表示します（i は既定で 1、-1 は最初）"
korean = "/times ?s?i 는 이름 s로 시작하는 서버 또는 플레이어의 최근 5개 기록을 시간 i부터 표시합니다 (i = 기본값 1, -1은 처음)"
simplified_chinese = "/times ?s?i 显示服务器最近 5 次成绩，或名称以 s 开头玩家从第 i 条开始的 5 次成绩（i 默认 1，-1 表示第一条）"

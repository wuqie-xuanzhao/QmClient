[[message]]
key = "Teleport free spectator camera between hovered tele-in/out or checkpoint tele and a matching counterpart"
[message.translations]
japanese = "ホバーしたテレポート入口/出口またはチェックポイントテレポートと対応する相手の間で自由観戦カメラをテレポート"
korean = "마우스 오버된 텔레포트 입/출구 또는 체크포인트 텔레포트와 일치하는 상대 지점 사이로 자유 관전 카메라를 순간이동합니다."
simplified_chinese = "在悬停的传送入口/出口或检查点传送点与其对应点之间传送自由观战镜头"
traditional_chinese = "在懸停的傳送入口/出口或檢查點傳送點與其對應點之間傳送自由觀戰鏡頭"

[[message]]
key = "Teleport yourself out of freeze if auto rescue mode is enabled, otherwise it will set position for rescuing if grounded and teleport you out of freeze if not (use sv_rescue 1 to enable this feature)"
[message.translations]
japanese = "自動レスキューモードが有効な場合はフリーズからテレポートアウト。それ以外の場合は、接地していればレスキュー用の位置を設定し、接地していなければフリーズからテレポートアウト（sv_rescue 1 でこの機能を有効化）"
korean = "자동 구조 모드가 활성화된 경우 동결 상태에서 순간이동합니다. 그렇지 않으면 착지 시 구조 위치를 설정하고, 착지하지 않은 경우 동결 상태에서 순간이동합니다 (sv_rescue 1을 사용하여 이 기능을 활성화)."
simplified_chinese = "若启用自动救援模式，则直接将你传送出冻结；否则，落地时会记录救援位置，未落地则直接传送出冻结（用 sv_rescue 1 启用）"
traditional_chinese = "若啟用自動救援模式，則直接將你傳送出的凍結；否則，落地時會記錄救援位置，未落地則直接傳送出的凍結（用 sv_rescue 1 啟用）"

[[message]]
key = "Teleport yourself to player or to where you are spectating/or looking if no player name is given"
[message.translations]
japanese = "プレイヤー名が指定されていない場合は、観戦中または見ている場所に自分をテレポート"
korean = "플레이어 이름이 주어지지 않으면 자신을 해당 플레이어 또는 관전/바라보는 위치로 순간이동합니다."
simplified_chinese = "若未给出玩家名，则将自己传送到目标玩家，或传送到你当前旁观/瞄准的位置"
traditional_chinese = "若未給出玩家名，則將自己傳送到目標玩家，或傳送到你目前旁觀/瞄準的位置"

[[message]]
key = "Teleport yourself to the last auto rescue position before you died (use sv_rescue 1 to enable this feature)"
[message.translations]
japanese = "死亡前の最後の自動レスキュー位置に自分をテレポート（sv_rescue 1 でこの機能を有効化）"
korean = "죽기 전 마지막 자동 구조 위치로 순간이동합니다 (sv_rescue 1을 사용하여 이 기능을 활성화)."
simplified_chinese = "将自己传送到死亡前的最后一个自动救援位置（使用 sv_rescue 1 启用此功能）"
traditional_chinese = "將自己傳送到死亡前的最後一個自動救援位置（使用 sv_rescue 1 啟用此功能）"

[[message]]
key = "Teleport yourself to the last location you teleported to"
[message.translations]
japanese = "最後にテレポートした場所に自分をテレポート"
korean = "마지막으로 순간이동한 위치로 순간이동합니다."
simplified_chinese = "将自己传送到上次传送到的位置"
traditional_chinese = "將自己傳送到上次傳送到的位置"

[[message]]
key = "Teleport yourself to the specified coordinates. A tilde (~) can be used to denote your current position, e.g. '/tpxy ~1 ~' to teleport one tile to the right"
[message.translations]
japanese = "指定座標へテレポートします。チルダ（~）は現在位置を表せます。例: '/tpxy ~1 ~' で右へ一タイル移動します"
korean = "지정된 좌표로 순간이동합니다. 물결표(~)는 현재 위치를 나타내는 데 사용할 수 있습니다. 예: '/tpxy ~1 ~'는 오른쪽으로 한 타일 순간이동합니다."
simplified_chinese = "将自己传送到指定坐标。波浪号 (~) 表示当前位置，例如 '/tpxy ~1 ~' 表示向右传送一格"
traditional_chinese = "將自己傳送到指定座標。波浪號 (~) 表示目前位置，例如 '/tpxy ~1 ~' 表示向右傳送一格"

[[message]]

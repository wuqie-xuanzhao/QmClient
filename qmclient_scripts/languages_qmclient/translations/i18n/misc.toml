[[message]]
key = "Teleport free spectator camera between hovered tele-in/out or checkpoint tele and a matching counterpart"
[message.translations]
simplified_chinese = "在悬停的传送入口/出口或检查点传送点与其对应点之间传送自由观战镜头"
traditional_chinese = "在懸停的傳送入口/出口或檢查點傳送點與其對應點之間傳送自由觀戰鏡頭"
japanese = "ホバーしたテレポート入口/出口またはチェックポイントテレポートと対応する相手の間で自由観戦カメラをテレポート"
korean = "마우스 오버된 텔레포트 입/출구 또는 체크포인트 텔레포트와 일치하는 상대 지점 사이로 자유 관전 카메라를 순간이동합니다."
russian = "Телепортировать свободную камеру наблюдателя между наведённым телепортом входа/выхода или чекпоинтом и соответствующим объектом"
german = "Teleportiere die freie Zuschauerkamera zwischen einem schwebenden Teleport-Ein/Ausgang oder Checkpoint-Teleport und einem passenden Gegenstück"
spanish = "Teletransportar la cámara libre del espectador entre el teleport de entrada/salida o el checkpoint tele señalado y una contraparte coincidente"
french = "Téléporter la caméra libre du spectateur entre le téléporteur d'entrée/sortie survolé ou le téléporteur de checkpoint et une contrepartie correspondante"
brazilian_portuguese = "Teleportar câmera de espectador livre entre tele-in/out ou checkpoint tele pairando e uma contraparte correspondente"
portuguese = "Teletransportar câmara de espetador livre entre tele-in/out pairando ou checkpoint tele e um correspondente correspondente"
turkish = "Üzerinde durulan ışınlanma giriş/çıkışı veya kontrol noktası ışınlanması ile eşleşen bir karşılığı arasında serbest izleyici kamerasını ışınla"
polish = "Teleportuj swobodną kamerę obserwatora między wskazanym teleportem wejścia/wyjścia lub teleportem punktu kontrolnego a pasującym odpowiednikiem"
[[message]]
key = "Teleport yourself out of freeze if auto rescue mode is enabled, otherwise it will set position for rescuing if grounded and teleport you out of freeze if not (use sv_rescue 1 to enable this feature)"
[message.translations]
japanese = "自動レスキューモードが有効な場合はフリーズからテレポートアウト。それ以外の場合は、接地していればレスキュー用の位置を設定し、接地していなければフリーズからテレポートアウト（sv_rescue 1 でこの機能を有効化）"
korean = "자동 구조 모드가 활성화된 경우 동결 상태에서 순간이동합니다. 그렇지 않으면 착지 시 구조 위치를 설정하고, 착지하지 않은 경우 동결 상태에서 순간이동합니다 (sv_rescue 1을 사용하여 이 기능을 활성화)."
simplified_chinese = "若启用自动救援模式，则直接将你传送出冻结；否则，落地时会记录救援位置，未落地则直接传送出冻结（用 sv_rescue 1 启用）"
traditional_chinese = "若啟用自動救援模式，則直接將你傳送出的凍結；否則，落地時會記錄救援位置，未落地則直接傳送出的凍結（用 sv_rescue 1 啟用）"
russian = "Телепортироваться из заморозки, если включён режим автоспасения; в противном случае установит позицию для спасения, если на земле, и телепортирует из заморозки, если нет (используйте sv_rescue 1 для включения этой функции)"

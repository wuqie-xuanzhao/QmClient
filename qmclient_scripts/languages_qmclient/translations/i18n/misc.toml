[[message]]
key = "Team successfully saved by %s. The database connection failed, using generated save code instead to avoid collisions. Use '/load %s' on %s to continue"
[message.translations]
simplified_chinese = "队伍已由 %s 成功存档。数据库连接失败，因此改用生成的存档码避免冲突。请在 %s 上用 '/load %s' 继续"
traditional_chinese = "Pending traditional_chinese translation bd6ca3d6dd"
japanese = "Pending japanese translation e30f06f513"
korean = "%s 님이 팀을 성공적으로 저장했습니다. 데이터베이스 연결에 실패하여 충돌을 피하기 위해 생성된 저장 코드를 대신 사용합니다. %s 에서 '/load %s' 를 사용하여 계속하세요"
russian = "Команда успешно сохранена %s. Соединение с базой данных не удалось, используется сгенерированный код сохранения во избежание коллизий. Используйте '/load %s' на %s для продолжения"
german = "Team erfolgreich von %s gespeichert. Die Datenbankverbindung ist fehlgeschlagen, stattdessen wird ein generierter Speichercode verwendet, um Kollisionen zu vermeiden. Verwende '/load %s' auf %s, um fortzufahren"
spanish = "Equipo guardado exitosamente por %s. La conexión a la base de datos falló, usando un código de guardado generado en su lugar para evitar colisiones. Usa '/load %s' en %s para continuar"
french = "Équipe sauvegardée avec succès par %s. La connexion à la base de données a échoué, utilisation d'un code de sauvegarde généré pour éviter les collisions. Utilisez '/load %s' sur %s pour continuer"
brazilian_portuguese = "Equipe salva com sucesso por %s. A conexão com o banco de dados falhou, usando código de save gerado para evitar colisões. Use '/load %s' em %s para continuar"
portuguese = "Equipa guardada com sucesso por %s. A conexão à base de dados falhou, usando código de salvamento gerado para evitar colisões. Usa '/load %s' em %s para continuar"
turkish = "Takım %s tarafından başarıyla kaydedildi. Veritabanı bağlantısı başarısız oldu, çakışmaları önlemek için bunun yerine oluşturulan kayıt kodu kullanılıyor. Devam etmek için %s üzerinde '/load %s' kullanın"

[[message]]
key = "Are you sure that you want to import the touch controls from the clipboard? This will overwrite your current touch controls."
[message.translations]
simplified_chinese = "您确定要从剪贴板导入触控设置吗？这将覆盖当前的触控设置。"
traditional_chinese = "Pending traditional_chinese translation 9e60dd05d2"
japanese = "Pending japanese translation e21bfcb35d"
korean = "클립보드에서 터치 컨트롤을 가져오시겠습니까? 현재 터치 컨트롤이 덮어쓰여집니다."
russian = "Вы уверены, что хотите импортировать сенсорное управление из буфера обмена? Это перезапишет текущие настройки."
german = "Bist du sicher, dass du die Touch-Steuerungen aus der Zwischenablage importieren möchtest? Dies überschreibt deine aktuellen Touch-Steuerungen."
spanish = "¿Estás seguro de que quieres importar los controles táctiles desde el portapapeles? Esto sobrescribirá tus controles táctiles actuales."
french = "Êtes-vous sûr de vouloir importer les commandes tactiles depuis le presse-papiers ? Cela écrasera vos commandes tactiles actuelles."
brazilian_portuguese = "Tem certeza de que deseja importar os controles de toque da área de transferência? Isso substituirá seus controles de toque atuais."
portuguese = "Tem a certeza de que deseja importar os controlos táteis da área de transferência? Isto substituirá os seus controlos táteis atuais."
turkish = "Dokunmatik kontrolleri panodan içe aktarmak istediğinizden emin misiniz? Bu, mevcut dokunmatik kontrollerinizin üzerine yazacaktır."
polish = "Czy na pewno chcesz zaimportować sterowanie dotykowe ze schowka? Spowoduje to nadpisanie bieżących ustawień."


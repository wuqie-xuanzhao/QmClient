traditional_chinese = "你的隊伍還沒有開始"

[[message]]
key = "Your team is currently saving"
[message.translations]
japanese = "あなたのチームは現在保存中です"
korean = "팀이 현재 저장 중입니다"
simplified_chinese = "你的队伍当前正在保存"
traditional_chinese = "你的隊伍當前正在儲存"

[[message]]
key = "Your team was killed because it couldn't finish anymore and hasn't entered /practice mode"
[message.translations]
japanese = "あなたのチームはもう完走できず、/practiceモードにも入っていないため処刑されました"
korean = "더 이상 완주할 수 없고 /practice 모드를 입력하지 않아 팀이 죽었습니다"
simplified_chinese = "你的队伍因已无法完赛且未进入 /practice 模式而被处死"
traditional_chinese = "你的隊伍因已無法完賽且未進入 /practice 模式而被處死"

[[message]]
key = "Your team was unlocked by an unlock team tile"
[message.translations]
japanese = "あなたのチームはチームロック解除タイルによってロック解除されました"
korean = "팀 잠금 해제 타일로 팀이 잠금 해제되었습니다"
simplified_chinese = "你的队伍已被解锁队伍图块解除锁定"
traditional_chinese = "你的隊伍已被解鎖隊伍圖塊解除鎖定"

[[message]]
key = "Your timeout code has been set. 0.7 clients can not reclaim their tees on timeout; however, a 0.6 client can claim your tee"
[message.translations]
japanese = "タイムアウトコードが設定されました。0.7クライアントはタイムアウト時にTeeを取り戻せませんが、0.6クライアントはあなたのTeeを主張できます"
korean = "타임아웃 코드가 설정되었습니다. 0.7 클라이언트는 타임아웃 시 티를 되찾을 수 없지만, 0.6 클라이언트는 당신의 티를 요구할 수 있습니다"
simplified_chinese = "你的 timeout code 已设置"
traditional_chinese = "你的 timeout code 已設定。0.7 客戶端無法在超時時取回他們的 tee；然而，0.6 客戶端可以取走你的 tee"


[[message]]
key = "Left-click a Frankenstein part to tint it. Drag parts to replace them. Right-click resets."
[message.translations]
simplified_chinese = "左键点击右侧部件可调色，拖拽可替换部件，右键可重置。"
traditional_chinese = "左鍵點擊右側部件可調色，拖拽可替換部件，右鍵可重置。"
japanese = "フランケンパーツを左クリックで色を変更します。ドラッグでパーツを交換します。右クリックでリセットします。"
korean = "프랑켄슈타인 부품을 왼쪽 클릭하면 색상을 변경할 수 있습니다. 부품을 드래그하여 교체하고, 오른쪽 클릭하면 초기화됩니다."

[[message]]
key = "An error during command recording occurred. Try to update your GPU drivers."
context = "Graphics error"
[message.translations]
japanese = "コマンド記録中にエラーが発生しました。GPUドライバーを更新してみてください。"

[[message]]
key = "Could not initialize the given graphics backend, reverting to the default backend now."
context = "Graphics error"
[message.translations]
japanese = "指定されたグラフィックスバックエンドを初期化できませんでした。デフォルトのバックエンドに戻します。"

[[message]]
key = "Could not initialize the given graphics backend, this is probably because you didn't install the driver of the integrated graphics card."
context = "Graphics error"
[message.translations]
japanese = "指定されたグラフィックスバックエンドを初期化できませんでした。おそらく、内蔵グラフィックスのドライバーがインストールされていないためです。"

[[message]]
key = "Failed during initialization. Try to change gfx_backend to OpenGL or Vulkan in settings_ddnet.cfg in the config directory and try again."
context = "Graphics error"
[message.translations]
japanese = "初期化に失敗しました。設定ディレクトリの settings_ddnet.cfg で gfx_backend を OpenGL または Vulkan に変更して、再試行してください。"

[[message]]
key = "Failed to swap framebuffers. Try to update your GPU drivers."
context = "Graphics error"
[message.translations]
japanese = "フレームバッファのスワップに失敗しました。GPUドライバーを更新してみてください。"

[[message]]
key = "Out of VRAM. Try setting 'cl_skins_loaded_max' to a lower value or remove custom assets (skins, entities, etc.), especially those with high resolution."
context = "Graphics error"
[message.translations]
japanese = "VRAM が不足しています。'cl_skins_loaded_max' を低い値に設定するか、カスタムアセット（スキン、エンティティなど）、特に高解像度のものを削除してみてください。"

[[message]]
key = "Submitting the render commands failed. Try to update your GPU drivers."
context = "Graphics error"
[message.translations]
japanese = "レンダリングコマンドの送信に失敗しました。GPUドライバーを更新してみてください。"

[[message]]
key = "Unknown error. Try to change gfx_backend to OpenGL or Vulkan in settings_ddnet.cfg in the config directory and try again."
context = "Graphics error"
[message.translations]
japanese = "不明なエラー。設定ディレクトリの settings_ddnet.cfg で gfx_backend を OpenGL または Vulkan に変更して、再試行してください。"


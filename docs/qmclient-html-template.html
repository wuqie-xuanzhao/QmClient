<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="dcterms.date" content="YYYY-MM-DD" />
  <meta name="status" content="draft" />
  <title>QmClient 文档模板</title>
  <style>
    :root {
      --bg: #f4f1ea;
      --paper: #fffdfa;
      --paper-2: #f7f2ea;
      --ink: #2d2924;
      --muted: #6f675f;
      --line: #ded4c6;
      --accent: #4f6f73;
      --accent-2: #b8795b;
      --ok: #5f7f55;
      --warn: #a57536;
      --bad: #a94d45;
      --shadow: 0 18px 45px rgba(62, 50, 39, 0.12);
      --code-bg: #ede6dc;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 0%, rgba(184, 121, 91, 0.16), transparent 30rem),
        radial-gradient(circle at 88% 8%, rgba(79, 111, 115, 0.14), transparent 28rem),
        linear-gradient(180deg, #f7f3ec 0%, var(--bg) 100%);
      font-family: "Noto Sans SC", "Segoe UI", "Microsoft YaHei", sans-serif;
      line-height: 1.72;
    }
    .page { max-width: 1180px; margin: 0 auto; padding: 28px 20px 56px; }
    .hero, .card {
      background: var(--paper);
      border: 1px solid rgba(222, 212, 198, 0.95);
      box-shadow: var(--shadow);
      border-radius: 22px;
    }
    .hero { padding: 28px 28px 24px; margin-bottom: 18px; }
    .card { padding: 22px 24px; margin-top: 18px; }
    h1, h2, h3 { margin: 0 0 12px; line-height: 1.2; }
    h1 { font-size: 28px; }
    h2 { font-size: 22px; }
    h3 { font-size: 17px; margin-top: 18px; }
    p { margin: 0 0 12px; }
    ul, ol { margin: 10px 0 0 22px; padding: 0; }
    li { margin: 4px 0; }
    code {
      padding: 0.12em 0.36em;
      border-radius: 6px;
      background: var(--code-bg);
      color: #613c2e;
      font-size: 0.94em;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 12px;
      font-size: 14px;
      display: block;
      overflow-x: auto;
    }
    th, td {
      border-top: 1px solid var(--line);
      padding: 10px 12px;
      vertical-align: top;
      text-align: left;
    }
    th { background: #faf5ed; color: #4f463d; font-weight: 700; white-space: nowrap; }
    tr:hover td { background: rgba(184, 121, 91, 0.03); }
    .meta { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 0; }
    .pill {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 10px; border-radius: 999px;
      background: rgba(79, 111, 115, 0.10); color: var(--accent);
      font-size: 12px; font-weight: 700; letter-spacing: 0.02em;
    }
    .pill.secondary { background: rgba(184, 121, 91, 0.10); color: var(--accent-2); }
    .pill.warn { background: rgba(165, 117, 54, 0.12); color: var(--warn); }
    .pill.bad { background: rgba(169, 77, 69, 0.12); color: var(--bad); }
    .pill.ok { background: rgba(95, 127, 85, 0.12); color: var(--ok); }
    .badge {
      display: inline-block; padding: 2px 8px;
      border-radius: 999px; font-size: 12px; font-weight: 700; white-space: nowrap;
    }
    .badge.ok { background: rgba(95, 127, 85, 0.12); color: var(--ok); }
    .badge.warn { background: rgba(165, 117, 54, 0.12); color: var(--warn); }
    .badge.bad { background: rgba(169, 77, 69, 0.12); color: var(--bad); }
    .muted { color: var(--muted); }
    .note {
      border-left: 4px solid var(--accent);
      padding: 10px 12px;
      background: rgba(79, 111, 115, 0.06);
      border-radius: 0 10px 10px 0;
      color: #4c4238;
    }
    .note.warn { border-left-color: var(--warn); background: rgba(165, 117, 54, 0.08); }
    .note.bad { border-left-color: var(--bad); background: rgba(169, 77, 69, 0.08); }
    .toc { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px; margin-top: 14px; }
    .toc a {
      display: block; padding: 10px 12px;
      border: 1px solid var(--line); border-radius: 12px;
      color: var(--ink); text-decoration: none;
      background: rgba(255,255,255,0.72);
    }
    .toc a:hover { border-color: rgba(184, 121, 91, 0.45); }
    details {
      margin-top: 10px; border: 1px solid var(--line);
      border-radius: 12px; background: rgba(255,255,255,0.65); padding: 10px 12px;
    }
    summary { cursor: pointer; font-weight: 700; color: #423b33; }
    .footer { margin-top: 18px; color: var(--muted); font-size: 13px; }
    @media (max-width: 920px) {
      .hero, .card { padding-left: 18px; padding-right: 18px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="hero">
      <div class="meta">
        <span class="pill ok">status</span>
        <span class="pill secondary">YYYY-MM-DD</span>
      </div>
      <h1>文档标题</h1>
      <p class="muted">一句话说明本文档的范围、可信度和维护口径。</p>
    </header>
    <section class="card">
      <h2>章节标题</h2>
      <p>正文。</p>
    </section>
  </div>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QmClient 按键显示编辑器</title>
<style>
:root{color-scheme:dark;--bg:#11151b;--panel:#1a2029;--panel2:#202936;--line:#344050;--text:#e8edf4;--muted:#9aa7b8;--accent:#63b3ff;--danger:#ff7373}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.35 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
button,input,select{font:inherit;color:inherit}button{border:1px solid var(--line);background:#273140;border-radius:4px;padding:7px 10px;cursor:pointer}button:hover{border-color:var(--accent);background:#2d3a4c}button.primary{background:#2675b9;border-color:#439ce9}button.danger{border-color:#8b3d48;color:#ffabab}.toolbar{display:flex;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);background:#151b23;position:sticky;top:0;z-index:4}.toolbar h1{font-size:16px;margin:0 14px 0 0;white-space:nowrap}.toolbar .spacer{flex:1}.toolbar label{color:var(--muted);display:flex;align-items:center;gap:5px}.toolbar input{width:92px}.toolbar #profileName{width:160px}
.app{display:grid;grid-template-columns:240px minmax(400px,1fr) 320px;min-height:calc(100vh - 57px)}.sidebar,.inspector{background:var(--panel);padding:12px;overflow:auto}.sidebar{border-right:1px solid var(--line)}.inspector{border-left:1px solid var(--line)}.section-title{font-size:11px;letter-spacing:0;text-transform:uppercase;color:var(--muted);margin:4px 0 8px}.element-list{display:flex;flex-direction:column;gap:4px}.element-row{display:flex;align-items:center;gap:6px;padding:7px;border:1px solid transparent;border-radius:4px;cursor:pointer}.element-row:hover{background:var(--panel2)}.element-row.active{background:#263d53;border-color:#367ba9}.element-row .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.element-row .badge{font-size:10px;color:var(--muted)}.row-actions{display:flex;gap:5px;margin-top:10px}.row-actions button{flex:1}.hint{font-size:12px;color:var(--muted);margin:10px 0}.workspace{padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}.canvas-wrap{flex:1;min-height:440px;display:flex;align-items:flex-start;justify-content:flex-start;background:#0b0e13;border:1px solid var(--line);border-radius:5px;overflow:auto;padding:20px}.canvas-frame{position:relative;margin-inline:auto;box-shadow:0 0 0 1px #445264,0 10px 40px #0008;background:repeating-conic-gradient(#202832 0 25%,#171d25 0 50%) 50%/20px 20px}.canvas-frame canvas{display:block}.canvas-frame .selection{position:absolute;border:1px solid var(--accent);box-shadow:0 0 0 1px #0b0e13;pointer-events:none}.canvas-frame .selection:after{content:"";position:absolute;right:-5px;bottom:-5px;width:8px;height:8px;background:var(--accent);border:1px solid #0b0e13}.status{display:flex;gap:14px;color:var(--muted);font-size:12px}.group{border-top:1px solid var(--line);padding:12px 0}.group:first-child{border-top:0;padding-top:0}.field{display:grid;grid-template-columns:112px 1fr;align-items:center;gap:8px;margin:7px 0}.field label{color:var(--muted);font-size:12px}.field input,.field select{width:100%;min-width:0;background:#11161d;border:1px solid var(--line);border-radius:3px;padding:6px}.field input[type=color]{height:31px;padding:2px}.field input[type=checkbox]{width:auto;justify-self:start}.split{display:grid;grid-template-columns:1fr 1fr;gap:7px}.split .field{grid-template-columns:62px 1fr}.small{font-size:11px;color:var(--muted)}.binding{display:flex;gap:6px}.binding select{flex:1}.binding button{white-space:nowrap}.drop{border:1px dashed #4a5c70;padding:8px;text-align:center;color:var(--muted);border-radius:4px;cursor:pointer}.drop:hover{border-color:var(--accent);color:var(--text)}.toast{position:fixed;right:16px;bottom:16px;padding:10px 14px;background:#273140;border:1px solid var(--line);border-radius:4px;opacity:0;transform:translateY(10px);transition:.2s;pointer-events:none;z-index:10}.toast.show{opacity:1;transform:none}
@media(max-width:1100px){.app{grid-template-columns:210px minmax(300px,1fr)}.inspector{grid-column:1/-1;border-left:0;border-top:1px solid var(--line);max-height:none;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.inspector .group{border-top:0;padding:0}.inspector .group:first-child{padding-top:0}}@media(max-width:700px){.app{display:block}.sidebar{border-right:0;border-bottom:1px solid var(--line);max-height:210px}.workspace{min-height:470px}.inspector{display:block}.toolbar{flex-wrap:wrap}.toolbar h1{width:100%}}
</style>
</head>
<body>
<header class="toolbar">
  <h1>QmClient 按键显示编辑器</h1>
  <label>名称 <input id="profileName" value="我的布局" maxlength="96"></label>
  <label>画布 <input id="canvasW" type="number" min="1" max="16384" value="720">x<input id="canvasH" type="number" min="1" max="16384" value="360"></label>
  <span class="spacer"></span>
  <button id="newBtn">新建</button><button id="openBtn">导入 JSON + PNG</button><button id="previewNormal" class="active">普通</button><button id="previewPressed">按下</button><button class="primary" id="exportBtn">导出 JSON + PNG</button>
  <input id="overlayFiles" type="file" accept="application/json,.json,image/png,.png" multiple hidden>
</header>
<main class="app">
  <aside class="sidebar">
    <div class="section-title">元素</div>
    <div id="elementList" class="element-list"></div>
    <div class="row-actions"><button id="addBtn">添加</button><button id="duplicateBtn">复制</button><button class="danger" id="deleteBtn">删除</button></div>
    <p class="hint">在画布上拖拽元素调整位置，右下角拖动可改大小。官方 OBS 元素类型 0-9，图片、字体、样式与动画设置保存在编辑器扩展中。</p>
    <div class="section-title">资源</div>
    <div id="assetList" class="small"></div>
    <label class="drop" for="assetInput">添加 PNG 或 SVG 图片<input id="assetInput" type="file" accept="image/png,image/svg+xml" hidden></label>
    <div id="fontList" class="small" style="margin-top:7px"></div>
    <label class="drop" for="fontInput" style="margin-top:7px">加载自定义字体<input id="fontInput" type="file" accept="font/woff,font/woff2,font/ttf,font/otf" hidden></label>
  </aside>
  <section class="workspace">
    <div class="canvas-wrap"><div class="canvas-frame" id="canvasFrame"><canvas id="preview"></canvas><div class="selection" id="selection"></div></div></div>
    <div class="status"><span id="statusText">就绪</span><span id="frameText"></span><span>PNG 图集由此预览渲染生成</span></div>
  </section>
  <aside class="inspector">
    <div class="group"><div class="section-title">元素</div><div class="field"><label>ID</label><input id="elId" maxlength="256"></div><div class="field"><label>标签</label><input id="elLabel" maxlength="256"></div><div class="field"><label>类型</label><select id="elType"><option value="0">0 纹理</option><option value="1">1 键盘按键</option><option value="2">2 手柄按钮</option><option value="3">3 鼠标按键</option><option value="4">4 滚轮</option><option value="5">5 摇杆</option><option value="6">6 扳机</option><option value="7">7 手柄编号</option><option value="8">8 方向键</option><option value="9">9 鼠标移动</option></select></div><div class="field"><label>分组</label><select id="elGroup"><option value="keyboard">键盘</option><option value="mouse">鼠标</option><option value="gamepad">手柄</option><option value="other">其他</option></select></div><div class="field"><label>仅激活时显示</label><input id="elActive" type="checkbox"></div></div>
    <div class="group"><div class="section-title">绑定</div><div class="binding"><select id="bindKind"><option value="always">始终显示</option><option value="key">键盘按键</option><option value="mouse_button">鼠标按键</option><option value="wheel">鼠标滚轮</option><option value="mouse_move">鼠标移动</option></select><button id="captureBtn">捕获按键</button></div><div class="field"><label>按键码</label><input id="bindCode" type="number" min="0" max="65535"></div><div class="field"><label>方向</label><select id="bindDirection"><option value="0">任意 / 居中</option><option value="1">上</option><option value="2">下</option><option value="3">左</option><option value="4">右</option><option value="5">自定义</option></select></div><div class="small" id="bindingHelp">按下一个键盘按键，或选择绑定方式。</div></div>
    <div class="group"><div class="section-title">官方选项</div><div class="field"><label>侧</label><select id="elSide"><option value="-1">默认</option><option value="0">0 左</option><option value="1">1 右</option></select></div><div class="field"><label>摇杆半径</label><input id="stickRadius" type="number" min="0" max="16384"></div><div class="field"><label>鼠标半径</label><input id="mouseRadius" type="number" min="0" max="16384"></div><div class="field"><label>鼠标类型</label><select id="mouseType"><option value="0">0 圆点</option><option value="1">1 箭头</option></select></div><div class="field"><label>扳机模式</label><input id="triggerMode" type="checkbox"></div></div>
    <div class="group"><div class="section-title">几何与位置</div><div class="split"><div class="field"><label title="元素左上角在画布上的水平位置">X 位置</label><input id="elX" type="number" step="0.1"></div><div class="field"><label title="元素左上角在画布上的垂直位置">Y 位置</label><input id="elY" type="number" step="0.1"></div><div class="field"><label title="元素宽度">宽度</label><input id="elW" type="number" min="1" step="0.1"></div><div class="field"><label title="元素高度">高度</label><input id="elH" type="number" min="1" step="0.1"></div><div class="field"><label title="绘制层级，数值越大越靠前">层级</label><input id="elZ" type="number" step="1"></div><div class="field"><label title="顺时针旋转角度">旋转</label><input id="elRotation" type="number" step="0.1"></div><div class="field"><label title="水平斜切百分比">斜切 X</label><input id="elSkew" type="number" step="0.1"></div></div><p class="hint">在画布上点击选中元素，直接拖拽即可调整位置；右下角拖动可改大小。</p></div>
    <div class="group"><div class="section-title">样式</div><div class="field"><label>字体</label><select id="styleFont"><option>system-ui</option><option>Arial</option><option>Verdana</option><option>Georgia</option><option>monospace</option></select></div><div class="field"><label>字号</label><input id="styleFontSize" type="number" min="1" max="512" step="1"></div><div class="field"><label>普通填充</label><input id="normalFill" type="color"></div><div class="field"><label>按下填充</label><input id="pressedFill" type="color"></div><div class="field"><label>渐变终点</label><input id="gradientColor" type="color"></div><div class="field"><label>普通文字</label><input id="normalText" type="color"></div><div class="field"><label>按下文字</label><input id="pressedText" type="color"></div><div class="field"><label>文字描边</label><input id="textStrokeColor" type="color"></div><div class="field"><label>描边像素</label><input id="textStrokeWidth" type="number" min="0" max="32" step="0.5"></div><div class="field"><label>边框</label><input id="borderColor" type="color"></div><div class="field"><label>边框像素</label><input id="borderWidth" type="number" min="0" max="64" step="0.5"></div><div class="field"><label>圆角</label><input id="radius" type="number" min="0" max="512" step="1"></div><div class="field"><label>不透明度</label><input id="opacity" type="number" min="0" max="1" step="0.01"></div><div class="field"><label>渐变</label><input id="gradient" type="checkbox"></div><div class="field"><label>彩虹边框</label><input id="rainbow" type="checkbox"></div><div class="field"><label>图片</label><select id="imagePath"><option value="">无</option></select></div></div>
    <div class="group"><div class="section-title">动画</div><div class="field"><label>帧数</label><input id="frameCount" type="number" min="1" max="60" value="1"></div><div class="field"><label>帧率</label><input id="frameFps" type="number" min="1" max="60" value="30"></div><div class="small">动画帧数、时序与源资源保存在 JSON 编辑器扩展中。</div></div>
  </aside>
</main>
<div id="toast" class="toast"></div>
<script>
"use strict";
const OBS_VERSION=507,EDITOR_VERSION=1,MAX_ELEMENTS=256,MAX_ANIMATION_FRAMES=60,MAX_IMAGE_DIMENSION=16384,MAX_FILE_BYTES=16*1024*1024,RASTER_SCALE=2,INNER_BORDER=3;
const TYPE_NAMES=["纹理","键盘按键","手柄按钮","鼠标按键","滚轮","摇杆","扳机","手柄编号","方向键","鼠标移动"];
const $=id=>document.getElementById(id);
const defaultStyle={font:"system-ui",fontSize:28,normalFill:"#25313e",pressedFill:"#2e86c1",gradientColor:"#17212b",normalText:"#e8edf4",pressedText:"#ffffff",textStrokeColor:"#000000",textStrokeWidth:0,borderColor:"#708399",borderWidth:2,radius:7,opacity:1,gradient:false,rainbow:false,image:""};
let state={name:"我的布局",canvasWidth:720,canvasHeight:360,frameFps:30,defaultWidth:0,defaultHeight:0,spaceH:0,spaceV:0,flags:0,elements:[],rawOfficial:{},wrapper:null,atlasWidth:0,atlasHeight:0};
let selected=-1,drag=null,capture=false,previewPressed=false,assets=new Map(),fontFiles=new Map(),fontFaces=[],atlasImage=null,atlasBytes=null,atlasDirty=true;
function clone(value){return value==null?value:JSON.parse(JSON.stringify(value));}
function number(value,fallback=0){const n=Number(value);return Number.isFinite(n)?n:fallback;}
function integer(value,fallback=0){const n=Number(value);return Number.isInteger(n)?n:fallback;}
function clamp(value,min,max){return Math.max(min,Math.min(max,value));}
function safeFileName(name,fallback){const cleaned=String(name||"").replace(/[^A-Za-z0-9_.-]+/g,"-").replace(/^\.+/g,"").slice(0,96);return cleaned||fallback;}
function keyOf(value){return String(value||"").toLowerCase();}
function makeElement(id,label,type=1,x=20,y=20,w=86,h=70){return {id,label,type,code:type===1?44:0,zIndex:state.elements.length,x,y,width:w,height:h,rotation:0,skewX:0,group:type>=2&&type<=8?"gamepad":type===3||type===4||type===9?"mouse":"keyboard",activeOnly:false,side:-1,stickRadius:30,mouseRadius:30,mouseType:0,direction:0,triggerMode:false,mapX:0,mapY:0,mapW:w,mapH:h,mapPressX:0,mapPressY:h+INNER_BORDER,mapPressW:w,mapPressH:h,hasMappingPress:true,normalMappings:[],pressedMappings:[],mappingAllocated:false,binding:{kind:type===1?"key":"always",code:type===1?44:0,direction:0},style:{...defaultStyle},frames:1,renderMode:"style",rawOfficial:{}};}
function resetState(){return {name:"我的布局",canvasWidth:720,canvasHeight:360,frameFps:30,defaultWidth:0,defaultHeight:0,spaceH:0,spaceV:0,flags:0,elements:[],rawOfficial:{},wrapper:null,atlasWidth:0,atlasHeight:0};}
function clearResources(){assets.clear();fontFiles.clear();fontFaces=[];const select=$("styleFont");select.innerHTML="<option>system-ui</option><option>Arial</option><option>Verdana</option><option>Georgia</option><option>monospace</option>";}
function newDocument(){clearResources();atlasImage=null;atlasBytes=null;atlasDirty=true;state=resetState();state.elements.push(makeElement("w","W",1,317,28),makeElement("a","A",1,220,112),makeElement("s","S",1,317,112),makeElement("d","D",1,414,112),makeElement("space","空格",1,220,196,280,70),makeElement("mouse_left","鼠标左键",3,30,28,150,70),makeElement("wheel_up","滚轮上",4,30,120,150,55),makeElement("mouse_move","鼠标移动",9,30,190,150,55));selected=0;previewPressed=false;renderAll();toast("已创建新布局");}
function selectedElement(){return state.elements[selected]||null;}
function esc(value){return String(value).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));}
function color(value){return value||"#000000";}
function renderList(){const list=$("elementList");list.innerHTML="";state.elements.slice().sort((a,b)=>a.zIndex-b.zIndex).forEach(e=>{const row=document.createElement("div");row.className="element-row"+(state.elements.indexOf(e)===selected?" active":"");row.innerHTML=`<span class="name">${esc(e.label||e.id)}</span><span class="badge">${esc(TYPE_NAMES[e.type]||"type")}</span>`;row.onclick=()=>{selected=state.elements.indexOf(e);renderAll();};list.appendChild(row);});$("assetList").textContent=assets.size?`Images: ${Array.from(assets.keys()).join(", ")}`:"Images: none";$("fontList").textContent=fontFiles.size?`Fonts: ${Array.from(fontFiles.values()).map(x=>x.name).join(", ")}`:"Fonts: none";}
function drawRounded(ctx,x,y,w,h,r){r=Math.max(0,Math.min(r,Math.min(w,h)/2));ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function rainbow(t){const h=(t%1+1)%1,i=Math.floor(h*6),f=h*6-i,q=1-f,a=[[1,f,0],[q,1,0],[0,1,f],[0,q,1],[f,0,1],[1,0,q]][i%6];return `rgb(${a.map(v=>Math.round(v*255)).join(",")})`;}
function shade(hex,amount){const n=parseInt((hex||"#000000").slice(1),16),r=clamp((n>>16)+Math.round(255*amount),0,255),g=clamp(((n>>8)&255)+Math.round(255*amount),0,255),b=clamp((n&255)+Math.round(255*amount),0,255);return `rgb(${r},${g},${b})`;}
function drawStyledElement(ctx,e,pressed,now){ctx.save();ctx.translate(e.x+e.width/2,e.y+e.height/2);ctx.rotate(number(e.rotation)*Math.PI/180);ctx.transform(1,0,number(e.skewX)/100,1,0,0);ctx.translate(-e.width/2,-e.height/2);const s={...defaultStyle,...(e.style||{})};let fill=pressed?s.pressedFill:s.normalFill;if(s.gradient){const g=ctx.createLinearGradient(0,0,0,e.height);g.addColorStop(0,fill);g.addColorStop(1,s.gradientColor||shade(fill,-.16));fill=g;}ctx.globalAlpha=clamp(number(s.opacity,1),0,1);drawRounded(ctx,0,0,e.width,e.height,number(s.radius));ctx.fillStyle=fill;ctx.fill();if(number(s.borderWidth)>0){ctx.lineWidth=number(s.borderWidth);ctx.strokeStyle=s.rainbow?rainbow(now/5000):s.borderColor;ctx.stroke();}if(s.image&&assets.has(s.image)){ctx.save();drawRounded(ctx,0,0,e.width,e.height,number(s.radius));ctx.clip();ctx.drawImage(assets.get(s.image).image,0,0,e.width,e.height);ctx.restore();}if(e.label){ctx.font=`600 ${number(s.fontSize,28)}px ${s.font||"system-ui"}`;ctx.textAlign="center";ctx.textBaseline="middle";if(number(s.textStrokeWidth)>0){ctx.lineWidth=number(s.textStrokeWidth);ctx.strokeStyle=s.textStrokeColor;ctx.strokeText(e.label,e.width/2,e.height/2);}ctx.fillStyle=pressed?s.pressedText:s.normalText;ctx.fillText(e.label,e.width/2,e.height/2);}ctx.restore();}
function mappingRect(e,pressed,frame=0){const mappings=pressed?e.pressedMappings:e.normalMappings;const index=Math.max(0,Math.min(integer(frame),Array.isArray(mappings)&&mappings.length?mappings.length-1:0));const mapped=Array.isArray(mappings)&&mappings[index];if(Array.isArray(mapped)&&mapped.length===4)return {x:number(mapped[0]),y:number(mapped[1]),w:number(mapped[2]),h:number(mapped[3])};if(pressed&&e.hasMappingPress)return {x:e.mapPressX,y:e.mapPressY,w:e.mapPressW,h:e.mapPressH};if(pressed)return {x:e.mapX,y:e.mapY+e.mapH+INNER_BORDER,w:e.mapW,h:e.mapH};return {x:e.mapX,y:e.mapY,w:e.mapW,h:e.mapH};}
function drawAtlasElement(ctx,e,pressed,now){const rect=mappingRect(e,pressed);if(rect.w<=0||rect.h<=0)return;if(e.renderMode==="atlas"&&atlasImage){ctx.save();ctx.translate(e.x+e.width/2,e.y+e.height/2);ctx.rotate(number(e.rotation)*Math.PI/180);ctx.transform(1,0,number(e.skewX)/100,1,0,0);ctx.translate(-e.width/2,-e.height/2);ctx.drawImage(atlasImage,rect.x,rect.y,rect.w,rect.h,0,0,e.width,e.height);ctx.restore();}else{drawStyledElement(ctx,{...e,x:e.x,y:e.y,width:e.width,height:e.height},pressed,now);}}
function draw(pressed=previewPressed){const c=$("preview"),d=Math.min(2,Math.max(1,window.devicePixelRatio||1));c.width=Math.round(state.canvasWidth*d);c.height=Math.round(state.canvasHeight*d);c.style.width=state.canvasWidth+"px";c.style.height=state.canvasHeight+"px";const ctx=c.getContext("2d");ctx.setTransform(d,0,0,d,0,0);ctx.clearRect(0,0,state.canvasWidth,state.canvasHeight);const now=performance.now();state.elements.slice().sort((a,b)=>a.zIndex-b.zIndex).forEach(e=>{if(!pressed&&e.activeOnly)return;drawAtlasElement(ctx,e,pressed,now);});const frame=$("canvasFrame");frame.style.width=state.canvasWidth+"px";frame.style.height=state.canvasHeight+"px";updateSelection();}
